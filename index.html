<div id="remgrow-intro">
  <div class="intro-bg"></div>
  <div class="intro-text">RemGrowing</div>
</div>

<style>
/* 全体の黒背景＋切れ込みライン */
#remgrow-intro {
  position: fixed;
  top: 0;
  left: -100%; /* 左の画面外からスタート */
  width: 100%;
  height: 100%;
  background: #000; /* 完全な黒 */
  overflow: hidden;
  z-index: 99999;
  opacity: 1;
  transition:
    left 0.7s ease-out,
    opacity 0.1s ease-out;
}

/* 赤い切れ込みライン（斜め） */
#remgrow-intro .intro-bg {
  position: absolute;
  width: 200%;
  height: 200%;
  background: repeating-linear-gradient(
    -45deg,
    rgba(255, 0, 0, 0.15) 0px,
    rgba(255, 0, 0, 0.15) 6px,
    rgba(0, 0, 0, 1) 6px,
    rgba(0, 0, 0, 1) 12px
  );
  animation: bgMove 1.2s linear infinite;
}

@keyframes bgMove {
  from { transform: translateX(0); }
  to   { transform: translateX(-40px); }
}

/* ロゴテキスト */
#remgrow-intro .intro-text {
  position: absolute;
  width: 100%;
  height: 100%;
  color: #ff1a1a; /* 鮮烈な赤 */
  font-size: 4rem;
  font-weight: bold;
  letter-spacing: 0.15em;
  text-shadow:
    0 0 25px #ff1a1a,
    0 0 50px #ff0000,
    0 0 80px #ff0000;
  display: flex;
  justify-content: center;
  align-items: center;
}
</style>

<script>
setTimeout(() => {
  const intro = document.getElementById("remgrow-intro");

  /* 左 → 中央へ移動 */
  intro.style.left = "0%";

  /* 0.7秒後に右へ抜ける */
  setTimeout(() => {
    intro.style.left = "100%";  /* 右へスライドアウト */
    intro.style.opacity = "0";  /* 同時にフェードアウト */

    /* 完全に消す */
    setTimeout(() => intro.remove(), 200);
  }, 700);

}, 10); /* ページ読み込み直後に開始 */
</script>
